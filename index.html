<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#081A24">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Polaris</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icono.png">
<link rel="apple-touch-icon" href="./icono.png">
<style>
:root{--bg:#081A24;--s1:#0F2733;--s2:#1A3745;--tx:#FFFFFF;--t2:#9FB4BF;--mut:#6B8594;--ac:#22D3EE;--on:#04202A;--s3:#0C212C;--ac2:#22D3EE;--g:#0F3445;--rbg:#F3ECDD;--rtx:#2B2620;--rm:#6B6252;--rl:#DDD3BC;--fs:17px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html[data-th=claro]{--bg:#F2F7F6;--s1:#FFFFFF;--s2:#D9E6E4;--s3:#E7F0EF;--tx:#0F2A2D;--t2:#4F6669;--ac:#0D9488;--ac2:#0F766E;--on:#fff;--g:#DDEEEC}
html[data-th=clasico]{--bg:#111517;--s1:#1A2023;--s2:#283135;--s3:#151A1C;--tx:#ECEFF1;--t2:#A3AEB8;--ac:#0F766E;--ac2:#2DD4BF;--on:#fff;--g:#1D2B2E}
html[data-th=bosque]{--bg:#0A1A12;--s1:#112A1C;--s2:#1B3D2A;--s3:#0D2117;--tx:#EAF3EC;--t2:#9DB8A8;--ac:#2F7D4F;--ac2:#6FCF97;--on:#fff;--g:#14402B}
html[data-th=nocturno]{--bg:#070D1C;--s1:#101A33;--s2:#1B2A4D;--s3:#0B1429;--tx:#E8EEF8;--t2:#9FB0CC;--ac:#4FB3BF;--ac2:#7FD6E0;--on:#04202A;--g:#15244A}
html[data-th=coral]{--bg:#1C0F0D;--s1:#2B1815;--s2:#3F2420;--s3:#231210;--tx:#FBEFEC;--t2:#C9A8A1;--ac:#E2674A;--ac2:#FF9B85;--on:#1C0F0D;--g:#4A241E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;transition:transform .12s}
button:active,.card:active,.hero:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
p{margin:0}
.scr{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--sat);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#detail,#reader,#config{transform:translateX(100%)}
#detail.on,#reader.on,#config.on,.scr.on{transform:none}
.top{display:flex;align-items:center;gap:14px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:8px;font-size:30px;font-weight:600;letter-spacing:-.01em;color:var(--tx)}
.logo svg{color:var(--ac2);flex-shrink:0;margin-top:-6px}
#home{background:radial-gradient(120% 55% at 50% 0,var(--g) 0,var(--bg) 62%)}
.hi{font-size:34px;font-weight:700;margin:18px 0 4px;letter-spacing:-.01em}
.sub2{font-size:15px;font-style:italic;color:var(--t2);opacity:.85;margin-bottom:22px;line-height:1.4}
.add{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:16px;background:var(--ac);color:var(--on);font-size:17px;font-weight:600;margin-bottom:22px;box-shadow:0 8px 22px rgba(34,211,238,.28)}
#sheet h3.sh2{font-size:20px;font-weight:600;margin:0 0 14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin-bottom:10px;background:var(--s3);border-radius:16px;text-align:left;color:var(--t2)}
.fi{width:48px;height:48px;border-radius:12px;background:var(--s2);color:var(--ac2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ot{flex:1;display:flex;flex-direction:column;gap:2px}
.ot b{font-size:17px;color:var(--tx);font-weight:600}
.ot small{font-size:13px}
.mt{flex:1;margin:0;font-size:32px;font-weight:700;letter-spacing:-.01em}
.sb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx);margin-right:-8px;flex-shrink:0}
.srch{flex:1;min-width:0;height:44px;border-radius:14px;border:1px solid var(--s2);background:var(--s1);color:var(--tx);font:inherit;padding:0 14px;-webkit-user-select:text;user-select:text}
.fab{position:absolute;right:20px;bottom:calc(92px + var(--sab));width:60px;height:60px;border-radius:50%;background:var(--ac);color:var(--on);display:none;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(34,211,238,.35);z-index:3}
.fh{font-size:16px;font-weight:600;margin:6px 0 12px;display:flex;align-items:center;gap:8px}
.fh span{font-size:12px;color:var(--t2);font-weight:400}
.grid+.fh{margin-top:26px}
.empty.t svg{color:var(--ac2);stroke-width:1.4}
.pf{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:30px}
.pf .av{width:108px;height:108px}
.avw{position:relative}
.stb.cam{background:var(--ac);color:var(--on)}
.stb{position:absolute;right:0;bottom:4px;width:28px;height:28px;border-radius:50%;background:var(--s1);color:var(--ac2);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);pointer-events:none}
.pf .chip{margin-top:14px;padding:6px 18px;font-size:13px}
.pn{font-size:26px;font-weight:700;margin:14px 0 2px}
.pq{font-size:15px;color:var(--t2)}
.pn.ph{color:var(--t2);font-weight:500}
.pe{width:100%;text-align:left;margin-top:16px}
.pe input{width:100%;font:inherit;color:var(--tx);background:var(--s1);border:1px solid var(--s2);border-radius:12px;padding:12px;margin-bottom:10px;-webkit-user-select:text;user-select:text}
.sl{font-size:12px;font-weight:600;color:var(--t2);letter-spacing:.08em;margin:30px 4px 10px}
.grp{background:var(--s1);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:16px;text-align:left;font-size:16px;color:var(--tx);border-bottom:1px solid var(--s2)}
.grp .row:last-child{border-bottom:0}
.row .ri{color:var(--ac2);display:flex}
.row .tx2{flex:1}
.row b{font-weight:500;color:var(--t2);font-size:15px}
.row .cv2{color:var(--t2);display:flex}
.pdfw{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.pdfw canvas{box-shadow:0 2px 14px rgba(43,38,32,.25);background:#fff}
.doc{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:4px 6px 28px;font:var(--fs,17px)/1.75 Georgia,serif;color:var(--rtx);-webkit-user-select:text;user-select:text}
.doc img{max-width:100%;height:auto}
.doc table{border-collapse:collapse;max-width:100%}
.doc td,.doc th{border:1px solid var(--rl);padding:6px}
.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:14px;background:var(--s1);border:2px solid transparent;font-size:14px;color:var(--tx)}
.tb i{width:18px;height:18px;border-radius:50%}
.vg .tb{flex-direction:row;justify-content:center}
.tb.on{border-color:var(--ac2);font-weight:600}
.cbtn{display:block;width:100%;padding:16px;border-radius:14px;background:var(--s1);font-size:16px;color:var(--tx);margin-bottom:10px;text-align:center}
.cn{font-size:14px;color:var(--t2);line-height:1.5;margin:6px 4px 0}
.ci{display:flex;flex-direction:column;min-width:0}
.ci .bar{order:-1;margin-top:6px}
.trow{display:flex;align-items:center;gap:8px;min-width:0}
.trow .t{flex:1;min-width:0}
.tg2,.au,.chs,.lb{display:none}
.bdg{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.bdg .hf{position:static}
.hf.ok{background:var(--ac);color:var(--on)}
.grid.v-list{grid-template-columns:1fr;gap:16px}
.v-list .card{background:var(--s1);border-radius:24px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.v-list .cv{aspect-ratio:16/10;border-radius:0}
.v-list .cv img{object-position:center 20%}
.v-list .tag{display:none}
.v-list .ci{padding:14px 16px 16px}
.v-list .ci .bar{order:5;margin:12px 0 0}
.v-list .t{font-size:18px;font-weight:700;margin:0}
.v-list .tg2{display:inline-block;font-size:12px;padding:3px 10px;border-radius:10px;background:var(--s2);color:var(--ac2);flex-shrink:0}
.v-list .au{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--t2);margin:6px 0 10px;line-height:1.4}
.v-list .chs{display:flex;gap:6px;flex-wrap:wrap}
.v-list .chs span{font-size:12px;padding:3px 10px;border-radius:10px;border:1px solid var(--s2);color:var(--t2)}
.v-list .lb{display:block;order:6;margin-top:12px;background:#fff;color:#0F2A2D;text-align:center;font-weight:600;font-size:15px;padding:12px;border-radius:14px}
.grid.v-shelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 12px}
.v-shelf .card{display:flex;flex-direction:column}
.v-shelf .cv{border-radius:4px 4px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
.v-shelf .card::after{content:'';order:1;display:block;height:9px;background:linear-gradient(var(--s2),var(--s1));margin:0 -6px;border-radius:0 0 4px 4px;box-shadow:0 7px 9px rgba(0,0,0,.35)}
.v-shelf .ci{order:2}
.v-shelf .ci .bar{display:none}
.v-shelf .card .t{font-size:11px;margin-top:10px}
.v-shelf .tag{font-size:9px;padding:1px 5px}
.v-shelf .hf{width:20px;height:20px}
.v-mag .card:first-child{grid-column:1/-1}
.v-mag .card:first-child .cv{aspect-ratio:16/10}
.v-mag .card:first-child .t{font-size:20px;font-weight:700;white-space:normal;margin-top:12px}
.v-mag .au{display:block;font-size:12px;color:var(--t2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-mag .card:first-child .au{font-size:14px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--s2);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--ac)}
.sw.on::after{transform:translateX(18px)}
.row small{display:block;color:var(--t2);font-size:12px;margin-top:2px;line-height:1.35}
#reader.dim{filter:brightness(.82)}
.empty svg{color:var(--mut);stroke-width:1.2;margin-bottom:18px}
.empty h3{font-weight:500;font-size:19px}
.av{width:52px;height:52px;border-radius:50%;background:var(--s1);border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.av.big{width:88px;height:88px}
#dshade{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#drawer{position:absolute;top:0;bottom:0;left:0;width:80%;max-width:320px;background:var(--s3);padding:calc(28px + var(--sat)) 20px 20px;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:flex-start}
body.dr #dshade{opacity:1;pointer-events:auto}
body.dr #drawer{transform:none}
#drawer .chip{margin-top:12px;padding:6px 14px;font-size:12px}
#drawer h2{font-size:24px;font-weight:600;margin:14px 0 0}
#dedit{display:none;width:100%;margin-top:12px}
#drawer.ed #dedit{display:block}
#drawer input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--s2);border-radius:12px;padding:12px;-webkit-user-select:text;user-select:text;margin-bottom:10px}
#drawer .hint{font-size:12px;color:var(--t2);margin:-2px 0 10px}
#drawer nav{margin-top:22px;width:100%;border-top:1px solid var(--s2)}
#drawer nav button{display:flex;gap:14px;align-items:center;width:100%;padding:16px 4px;font-size:16px;color:var(--t2);text-align:left}
#drawer nav button.on{color:var(--ac)}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 24px}
.greet{font:italic 17px Georgia,serif;color:var(--t2);margin:2px 0 14px;line-height:1.4}
.hero{display:flex;gap:14px;background:var(--s1);border-radius:18px;padding:12px;margin-bottom:16px;width:100%;text-align:left;transition:transform .12s}
.hero .cv{width:80px;flex-shrink:0}
.hero .in{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.k{font-size:12px;color:var(--ac)}
.ttl{font-size:17px;font-weight:600;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--t2)}
.go{background:var(--ac);color:var(--on);font-weight:600;font-size:14px;padding:10px;border-radius:12px;text-align:center;margin-top:10px}
.bar{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.chip{font-size:13px;padding:8px 14px;border-radius:16px;background:var(--s1);color:var(--t2);flex-shrink:0}
.chip.on{background:var(--ac);color:var(--on);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.card{transition:transform .12s;cursor:pointer}
.cv{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--s1)}
.cv img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph{width:100%;height:100%;display:flex;align-items:flex-end;padding:10px;font-weight:600;font-size:14px;line-height:1.2;color:#fff;word-break:break-word}
.tag{position:absolute;left:6px;top:6px;font-size:11px;background:rgba(8,26,36,.8);color:var(--tx);padding:2px 7px;border-radius:8px}
.hf{color:#fff;background:rgba(8,26,36,.8);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.card .t{font-size:13px;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk{background:var(--s1);border-radius:10px;aspect-ratio:2/3;animation:pu 1.2s ease-in-out infinite}
@keyframes pu{50%{opacity:.45}}
.empty{text-align:center;padding:48px 24px}
.empty h3{font-size:18px;margin:0 0 6px}
.empty p{color:var(--t2);font-size:14px;line-height:1.5}
.empty .go{display:inline-block;padding:12px 24px;margin-top:18px}
.tabs{display:flex;align-items:center;justify-content:space-around;background:var(--s3);border-top:1px solid var(--s2);border-radius:20px 20px 0 0;padding:10px 0 calc(10px + var(--sab))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut,var(--t2));min-width:60px}
.tabs button.on{color:var(--ac2)}
.tabs .plus{background:var(--ac);color:var(--on);width:52px;height:52px;border-radius:50%;justify-content:center;margin-top:-26px;min-width:0}
.bk{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-left:-8px}
.dt{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}
.dt .cv{width:150px}
.dt h2{font-size:21px;margin:16px 0 2px}
.st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0}
.st div{background:var(--s1);border-radius:12px;padding:10px 4px;text-align:center;font-size:15px;font-weight:600}
.st small{display:block;font-weight:400;font-size:11px;color:var(--t2);margin-top:2px}
.acts{display:flex;justify-content:space-around;margin-top:18px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--t2);padding:8px 12px}
.acts button.on{color:var(--ac)}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--s1);border-radius:22px 22px 0 0;padding:10px 16px calc(16px + var(--sab));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
body.sh #shade{opacity:1;pointer-events:auto}
body.sh #sheet{transform:none}
#sheet .h{width:40px;height:4px;border-radius:2px;background:var(--s2);margin:0 auto 14px}
#sheet h3{font-size:16px;margin:0 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .r{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-size:15px;text-align:left}
#sheet .r.d{color:#F09595}
#sheet input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--s2);border-radius:12px;padding:12px;-webkit-user-select:text;user-select:text;margin:4px 0 12px}
#reader{background:var(--rbg);color:var(--rtx)}
#reader .bk{color:var(--rtx)}
#rd{flex:1;position:relative;margin:0 14px;overflow:hidden;perspective:1600px;perspective-origin:30% 50%}
.pg{position:absolute;inset:0;background:var(--rbg)}
#fl{transform-style:preserve-3d;background:none}
#rb{background:var(--rbg)}
#ub,#rb,#sh2,#bk2,#shd{position:absolute;inset:0}
#rb,#sh2,#bk2{backface-visibility:hidden;-webkit-backface-visibility:hidden}
#sh2{background:#000;opacity:0;pointer-events:none}
#bk2{transform:rotateY(180deg);background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,.04)),var(--rbg);pointer-events:none}
#shd{opacity:0;pointer-events:none}
.z{position:absolute;top:0;bottom:0;width:30%;z-index:5}
.msg{padding:40px 20px;text-align:center;line-height:1.6;color:var(--rm)}
.rf{padding:8px 26px calc(12px + var(--sab));text-align:center;font-size:12px;color:var(--rm)}
.rf .bar{background:var(--rl);margin:0 0 8px}
.rf .bar i{background:#2A6F5E}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<section class="scr on" id="home">
<div class="top" id="top"></div>
<main id="body"></main>
<nav class="tabs" id="tabs"></nav>
<button class="fab" id="fab" aria-label="Añadir libro"></button>
</section>
<section class="scr" id="detail">
<div class="top"><button class="bk" data-back aria-label="Volver"></button></div>
<main id="dt"></main>
</section>
<section class="scr" id="reader">
<div class="top"><button class="bk" data-back aria-label="Salir del lector"></button></div>
<div id="rd"><div class="z" id="zl" style="left:0"></div><div class="z" id="zr" style="right:0"></div><div class="pg" id="under"><div id="ub"></div><div id="shd"></div></div>
<div class="pg" id="fl"><div id="rb"></div><div id="sh2"></div><div id="bk2"></div></div></div>
<div class="rf"><div class="bar"><i id="rbar" style="width:0"></i></div><span id="rp"></span></div>
</section>
<section class="scr" id="config"><div class="top"><button class="bk" data-back aria-label="Volver"></button><h1 class="mt">Configuración</h1></div><main id="cfg"></main></section>
<input type="file" id="rfile" accept=".json,application/json" hidden>
<div id="shade"></div>
<div id="sheet"></div>
<div id="dshade"></div>
<aside id="drawer" aria-label="Perfil"><button class="av big" id="dav" aria-label="Cambiar foto"></button><button class="chip" id="ed">Editar</button><h2 id="dn"></h2><div id="dedit"><input id="nm" maxlength="10" placeholder="Tu nombre"><p class="hint">Máximo 10 caracteres. Toca la foto para cambiarla.</p><button class="go" style="width:100%;margin:0" id="nmok">Guardar</button></div><nav id="dnav"></nav></aside>
<input type="file" id="pf" accept="image/*" hidden>
<input type="file" id="pcam" accept="image/*" capture="user" hidden>
<input type="file" id="file" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
